name: Nightly status update

on:
  schedule:
    - cron: "10 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-status
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Refresh status
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/gfx906-hub-check.py

      - name: Commit and push
        env:
          MESSAGE: ${{ steps.check.outputs.message }}
        run: |
          git add README.md CHANGELOG.md docs/STATUS.md data/last-seen.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "gfx906-hub-bot"
          git config user.email "304566755+hermesbradgharrison@users.noreply.github.com"
          git commit -m "$MESSAGE"
          git push
